[package]
name = "hctr2-rs"
version = "0.9.2"
edition = "2024"
homepage = "https://github.com/jedisct1/hctr2-rs"
repository = "https://github.com/jedisct1/hctr2-rs"
description = "HCTR2 and HCTR3 length-preserving encryption with format-preserving variants"
license = "MIT OR Apache-2.0"
keywords = ["encryption", "hctr2", "hctr3", "fpe", "disk-encryption"]
categories = ["cryptography", "no-std"]
readme = "README.md"
include = ["src/**/*.rs", "README.md", "LICENSE*"]

[dependencies]
aes = "0.9.1"
polyval = "0.7.1"
sha2 = { version = "0.11.0", default-features = false }
cipher = "0.5.2"

[dev-dependencies]
ct-codecs = "1.1.7"

[features]
default = ["std"]
std = []
no_std = []

[profile.release]
lto = true
codegen-units = 1
